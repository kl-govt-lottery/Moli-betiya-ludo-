<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundan Ludo - Classic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #ffcc00;
        }
        #status {
            font-size: 14px;
            margin-bottom: 10px;
            background: #222;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #444;
            text-align: center;
        }
        /* Game Board Container */
        .ludo-board {
            width: 360px;
            height: 360px;
            background: #fff;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 4px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        /* Base Homes */
        .base-red { grid-column: 1 / 7; grid-row: 1 / 7; background: #e53935; border: 3px solid #b71c1c; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); padding: 15px; gap: 10px; }
        .base-green { grid-column: 10 / 16; grid-row: 1 / 7; background: #43a047; border: 3px solid #1b5e20; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); padding: 15px; gap: 10px; }
        .base-yellow { grid-column: 1 / 7; grid-row: 10 / 16; background: #fbc02d; border: 3px solid #f57f17; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); padding: 15px; gap: 10px; }
        .base-blue { grid-column: 10 / 16; grid-row: 10 / 16; background: #1e88e5; border: 3px solid #0d47a1; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); padding: 15px; gap: 10px; }

        .home-box {
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .base-red .home-box { color: #e53935; }
        .base-green .home-box { color: #43a047; }
        .base-yellow .home-box { color: #fbc02d; }
        .base-blue .home-box { color: #1e88e5; }

        /* Center Home */
        .center-home {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            background: #ffeb3b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            font-size: 12px;
            border: 2px solid #333;
        }

        /* Tracks / Cells */
        .cell {
            border: 1px solid #ccc;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
        }
        .path-red { background: #ffcdd2; }
        .path-green { background: #c8e6c9; }
        .path-yellow { background: #fff9c4; }
        .path-blue { background: #bbdefb; }
        .safe-spot { background: #e0e0e0; }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #ffcc00;
            color: #121212;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        #dice-display {
            font-size: 24px;
            background: #333;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <h1>🎲 Kundan Ludo Classic</h1>
    <div id="status">पासा फेंकने के लिए बटन दबाएं!</div>

    <!-- 15x15 Classic Ludo Board Grid -->
    <div class="ludo-board">
        <!-- Bases -->
        <div class="base-red">
            <div class="home-box" onclick="moveToken('red', 0)">R1</div>
            <div class="home-box" onclick="moveToken('red', 1)">R2</div>
            <div class="home-box" onclick="moveToken('red', 2)">R3</div>
            <div class="home-box" onclick="moveToken('red', 3)">R4</div>
        </div>
        <div class="base-green">
            <div class="home-box" onclick="moveToken('green', 0)">G1</div>
            <div class="home-box" onclick="moveToken('green', 1)">G2</div>
            <div class="home-box" onclick="moveToken('green', 2)">G3</div>
            <div class="home-box" onclick="moveToken('green', 3)">G4</div>
        </div>
        
        <div class="center-home">KUNDAN</div>

        <div class="base-yellow">
            <div class="home-box" onclick="moveToken('yellow', 0)">Y1</div>
            <div class="home-box" onclick="moveToken('yellow', 1)">Y2</div>
            <div class="home-box" onclick="moveToken('yellow', 2)">Y3</div>
            <div class="home-box" onclick="moveToken('yellow', 3)">Y4</div>
        </div>
        <div class="base-blue">
            <div class="home-box" onclick="moveToken('blue', 0)">B1</div>
            <div class="home-box" onclick="moveToken('blue', 1)">B2</div>
            <div class="home-box" onclick="moveToken('blue', 2)">B3</div>
            <div class="home-box" onclick="moveToken('blue', 3)">B4</div>
        </div>
    </div>

    <!-- Action Controls -->
    <div class="controls">
        <button onclick="rollDice()">पासा फेंकें (Roll)</button>
        <div id="dice-display">⚀</div>
        <button onclick="resetGame()">Restart</button>
    </div>

    <script>
        let currentDice = 0;
        let turn = 'red'; // red, green, yellow, blue

        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function rollDice() {
            currentDice = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-display').innerText = diceFaces[currentDice - 1];
            document.getElementById('status').innerText = `बारी: ${turn.toUpperCase()} | पासा आया: ${currentDice}. गोटी चुनें!`;
        }

        function moveToken(color, index) {
            if (currentDice === 0) {
                alert("पहले पासा फेंकें!");
                return;
            }
            if (color !== turn) {
                alert(`यह ${turn.toUpperCase()} की बारी है!`);
                return;
            }

            if (currentDice === 6) {
                alert(`${color.toUpperCase()} की गोटी घर से बाहर निकली!`);
            } else {
                alert(`चाल चली गई: ${currentDice} कदम`);
            }

            // बारी बदलना
            if (currentDice !== 6) {
                if (turn === 'red') turn = 'green';
                else if (turn === 'green') turn = 'yellow';
                else if (turn === 'yellow') turn = 'blue';
                else turn = 'red';
            } else {
                alert("6 आया है! आपको एक और मौका मिला है।");
            }

            currentDice = 0;
            document.getElementById('dice-display').innerText = '⚀';
            document.getElementById('status').innerText = `अब बारी है: ${turn.toUpperCase()} की। पासा फेंकें।`;
        }

        function resetGame() {
            turn = 'red';
            currentDice = 0;
            document.getElementById('dice-display').innerText = '⚀';
            document.getElementById('status').innerText = 'गेम रीसेट हो गया। पासा फेंकें!';
        }
    </script>

</body>
</html>
